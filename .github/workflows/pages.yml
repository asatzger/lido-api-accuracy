name: Pages

on:
  # Can be triggered by daily-analysis workflow or manually
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      # List the files being deployed for verification
      - name: List files to be deployed
        run: |
          echo "Files to be deployed to GitHub Pages:"
          ls -la
          echo "\nAssets directory:"
          ls -la assets/ || echo "Assets directory not found"
          echo "\nAssets charts directory:"
          ls -la assets/data/charts/ || echo "Charts directory not found"
        
      # Explicitly include the upload-artifact action
      - name: Setup upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: |
            index.html
            assets/**
          retention-days: 1
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v2
        with:
          # Upload the entire repository to include assets directory
          path: '.'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v3 